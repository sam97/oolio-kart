name: CI

on:
  push:
    branches: [main, advanced-challenge]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kart
          POSTGRES_PASSWORD: kart
          POSTGRES_DB: kart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kart -d kart"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Store tests run against this; without it they are skipped.
      TEST_DATABASE_URL: postgres://kart:kart@localhost:5432/kart?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # -short skips the test that needs the real coupon files, which are
      # never committed.
      - run: go test -race -short ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - run: docker compose build
