name: oolio-kart

services:
  postgres:
    image: postgres:18-alpine
    # Local development credentials only; please use secrets elsewhere.
    environment:
      POSTGRES_USER: kart
      POSTGRES_PASSWORD: kart
      POSTGRES_DB: kart
    volumes:
      - pgdata:/var/lib/postgresql
    # Published for local tools and TEST_DATABASE_URL; drop in production.
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kart", "-d", "kart"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  # One-shot: creates and updates the tables, and seeds the product catalogue.
  migrate:
    build:
      context: .
      args:
        CMD: cmd/migrate
    image: oolio-kart/migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ${ENV_FILE:-.env.none}
        required: false
    environment:
      DATABASE_URL: postgres://kart:kart@postgres:5432/kart?sslmode=disable
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-shot: puts the coupon base files into the coupons volume, from
  # COUPONS_SEED_DIR when it has them, otherwise from S3.
  coupon-data:
    image: alpine:3.22
    command: ["/bin/sh", "/scripts/fetch-coupons.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ${COUPONS_SEED_DIR:-./data/seed}:/seed:ro
      - coupons:/data

  # Scratch space for the clickhouse scanner, started only with
  # COMPOSE_PROFILES=clickhouse. It reads the coupon files from the coupons
  # volume itself; coupons-job creates and drops its table on each build.
  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    profiles: [clickhouse]
    depends_on:
      coupon-data:
        condition: service_completed_successfully
    # Local development credentials only; please use secrets elsewhere.
    environment:
      CLICKHOUSE_DB: coupons
      CLICKHOUSE_USER: kart
      CLICKHOUSE_PASSWORD: kart
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
      # Otherwise the entrypoint tries to chown the read-only coupons mount,
      # logging an error per file. The image's own folders already belong to
      # the clickhouse user.
      CLICKHOUSE_DO_NOT_CHOWN: 1
    volumes:
      # file() only reads from user_files.
      - coupons:/var/lib/clickhouse/user_files/coupons:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # No mem_limit: the scan's memory is capped per query, and in tests a
    # hard cgroup limit of 2 GB or less slowed the same scan from ~10s to
    # ~150s.
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "kart", "--password", "kart", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # Builds the valid coupons on start, then on COUPONS_SCHEDULE whenever the
  # files or rules have changed, and publishes them to Postgres.
  #   COUPONS_SCANNER=clickhouse COMPOSE_PROFILES=clickhouse docker compose up
  # switches it from the default go scanner to ClickHouse.
  coupons-job:
    build:
      context: .
      args:
        CMD: cmd/coupons-job
    image: oolio-kart/coupons-job
    depends_on:
      migrate:
        condition: service_completed_successfully
      coupon-data:
        condition: service_completed_successfully
      # Ignored unless the clickhouse profile is on.
      clickhouse:
        condition: service_healthy
        required: false
    # Optional staging/production overrides: ENV_FILE=staging.env docker compose up
    env_file:
      - path: ${ENV_FILE:-.env.none}
        required: false
    environment:
      DATABASE_URL: postgres://kart:kart@postgres:5432/kart?sslmode=disable
      COUPONS_DIR: /data
      COUPONS_SCANNER: ${COUPONS_SCANNER:-go}
      # Hidden from the coupon file listing; the container is read-only, so
      # bucket and Pebble files live in the coupons volume.
      COUPONS_BUCKET_DIR: /data/.buckets
      COUPONS_PEBBLE_DIR: /data/.pebble
      CLICKHOUSE_URL: clickhouse://kart:kart@clickhouse:9000/coupons
      # /data as the clickhouse service sees it, under its user_files.
      COUPONS_CLICKHOUSE_DIR: coupons
      COUPONS_MEMORY_LIMIT: 256MiB
    volumes:
      - coupons:/data
    mem_limit: 512m
    # Healthy once coupons are published.
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first build reads ~2 GB of gzip.
      start_period: 5m
      start_interval: 2s
    # An interrupted build publishes nothing, so a short grace period is
    # enough.
    stop_grace_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  kart-api:
    build:
      context: .
      args:
        CMD: api/kart-api
    image: oolio-kart/kart-api
    # Starts once the tables exist. It does not wait for coupons: orders
    # without a coupon work while the first build runs, and requests that
    # need the database answer 503 while it is down.
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Optional staging/production overrides: ENV_FILE=staging.env docker compose up
    env_file:
      - path: ${ENV_FILE:-.env.none}
        required: false
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://kart:kart@postgres:5432/kart?sslmode=disable
    ports:
      - "8080:8080"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # Longer than the API's 15s SHUTDOWN_TIMEOUT, so draining requests finish
    # before Docker sends SIGKILL.
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  coupons:
  pgdata:
  clickhouse-data:
