name: oolio-kart

services:
  # One-shot: puts the coupon base files into the coupons volume, from
  # COUPONS_SEED_DIR when it has them, otherwise from S3.
  coupon-data:
    image: alpine:3.22
    command: ["/bin/sh", "/scripts/fetch-coupons.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ${COUPONS_SEED_DIR:-./data/seed}:/seed:ro
      - coupons:/data

  coupons-server:
    build:
      context: .
      args:
        CMD: coupons-server
    image: oolio-kart/coupons-server
    depends_on:
      coupon-data:
        condition: service_completed_successfully
    # Optional staging/production overrides: ENV_FILE=staging.env docker compose up
    env_file:
      - path: ${ENV_FILE:-.env.none}
        required: false
    environment:
      COUPONS_ADDR: ":8081"
      COUPONS_DIR: /data
      # Hidden from the coupon file listing; the container is read-only, so
      # bucket files live in the coupons volume.
      COUPONS_BUCKET_DIR: /data/.buckets
      COUPONS_MEMORY_LIMIT: 256MiB
    volumes:
      - coupons:/data
    mem_limit: 512m
    # Internal only: reachable by kart-api on the compose network, not
    # published to the host.
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
      # The first build reads ~2 GB of gzip; later starts restore saved codes.
      start_period: 5m
      start_interval: 2s
    # Longer than its 10s COUPONS_SHUTDOWN_TIMEOUT.
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  kart-api:
    build:
      context: .
      args:
        CMD: kart-api
    image: oolio-kart/kart-api
    # Deliberately no depends_on coupons-server: the API starts and serves
    # orders without coupons while the coupons server is loading or down.
    # Optional staging/production overrides: ENV_FILE=staging.env docker compose up
    env_file:
      - path: ${ENV_FILE:-.env.none}
        required: false
    environment:
      ADDR: ":8080"
      COUPONS_URL: http://coupons-server:8081
    ports:
      - "8080:8080"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # Longer than the API's 15s SHUTDOWN_TIMEOUT, so draining requests finish
    # before Docker sends SIGKILL.
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  coupons:
