name: oolio-kart

services:
  postgres:
    image: postgres:18-alpine
    # Local development credentials only; please use secrets elsewhere.
    environment:
      POSTGRES_USER: kart
      POSTGRES_PASSWORD: kart
      POSTGRES_DB: kart
    volumes:
      - pgdata:/var/lib/postgresql
    # Published for local tools and TEST_DATABASE_URL; drop in production.
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kart", "-d", "kart"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  # One-shot: applies the database migrations.
  migrate:
    build:
      context: .
      args:
        CMD: cmd/coupons-job
    image: oolio-kart/coupons-job
    command: ["-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ${ENV_FILE:-.env.none}
        required: false
    environment:
      DATABASE_URL: postgres://kart:kart@postgres:5432/kart?sslmode=disable
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-shot: puts the coupon base files into the coupons volume, from
  # COUPONS_SEED_DIR when it has them, otherwise from S3.
  coupon-data:
    image: alpine:3.22
    command: ["/bin/sh", "/scripts/fetch-coupons.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ${COUPONS_SEED_DIR:-./data/seed}:/seed:ro
      - coupons:/data

  # Builds the valid coupons on start, then on COUPONS_SCHEDULE whenever the
  # files or rules have changed, and publishes them to Postgres.
  coupons-job:
    build:
      context: .
      args:
        CMD: cmd/coupons-job
    image: oolio-kart/coupons-job
    depends_on:
      migrate:
        condition: service_completed_successfully
      coupon-data:
        condition: service_completed_successfully
    # Optional staging/production overrides: ENV_FILE=staging.env docker compose up
    env_file:
      - path: ${ENV_FILE:-.env.none}
        required: false
    environment:
      DATABASE_URL: postgres://kart:kart@postgres:5432/kart?sslmode=disable
      COUPONS_DIR: /data
      # Hidden from the coupon file listing; the container is read-only, so
      # bucket files live in the coupons volume.
      COUPONS_BUCKET_DIR: /data/.buckets
      COUPONS_MEMORY_LIMIT: 256MiB
    volumes:
      - coupons:/data
    mem_limit: 512m
    # Healthy once coupons are published.
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first build reads ~2 GB of gzip.
      start_period: 5m
      start_interval: 2s
    # An interrupted build publishes nothing, so a short grace period is
    # enough.
    stop_grace_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  kart-api:
    build:
      context: .
      args:
        CMD: api/kart-api
    image: oolio-kart/kart-api
    # Deliberately no depends_on: the API starts and serves orders without
    # coupons while the database is down or the first build is running.
    # Optional staging/production overrides: ENV_FILE=staging.env docker compose up
    env_file:
      - path: ${ENV_FILE:-.env.none}
        required: false
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://kart:kart@postgres:5432/kart?sslmode=disable
    ports:
      - "8080:8080"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # Longer than the API's 15s SHUTDOWN_TIMEOUT, so draining requests finish
    # before Docker sends SIGKILL.
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  coupons:
  pgdata:
